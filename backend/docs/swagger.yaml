                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Ping the API
      tags:
      - diagnostics
  /docs:
    get:
      description: A Scalar reference page that fetches the document from /openapi.yaml,
        same origin, and renders it. The page itself is static and embedded; its script
        comes from a version-pinned CDN with a subresource-integrity hash, so the
        page renders blank without internet access. Registered only when DOCS_ENABLED
        is true.
      operationId: getAPIReference
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: the reference page
          headers:
            Cache-Control:
              description: no-cache, because the document changes on deploy
              schema:
                type: string
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Browse the API reference
      tags:
      - documentation
  /healthz:
    get:
      description: Answers as soon as the process can serve HTTP. It checks no dependency,
        so it stays 200 while PostgreSQL or Redis are down. Orchestrators restart
        a container on this one.
      operationId: getLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: OK
          headers:
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Liveness probe
      tags:
      - health
  /openapi.yaml:
    get:
      description: The contract for every route above, generated from the handlers
        by swag and compiled into the binary. Registered only when DOCS_ENABLED is
        true, and never rate limited, so a client that has spent its budget can still
        read why.
      operationId: getOpenAPIDocument
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: the OpenAPI 3.1 document
          headers:
            Cache-Control:
              description: no-cache, because the document changes on deploy
              schema:
                type: string
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Fetch the OpenAPI document
      tags:
      - documentation
  /readyz:
    get:
      description: 'Probes every dependency under one shared deadline and reports
        each by name. The 503 is a report rather than an error: its body is the same
        shape as the 200, not the error envelope, so a client parses one shape either
        way. Load balancers remove a pod from rotation on this one.'
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: OK
          headers:
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: one or more dependencies are down
          headers:
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Readiness probe
      tags:
      - health
servers:
- description: Local development
  url: http://localhost:8080
tags:
- description: Liveness and readiness probes. Unversioned, never rate limited, and
    meant for orchestrators rather than for people.
  name: health
- description: 'Versioned routes that exercise the service end to end: the router,
    the error envelope, the rate limiter and the PostgreSQL pool.'
  name: diagnostics
- description: Routes that exist to provoke failure. Registered only when DEBUG_ROUTES_ENABLED
    is true, so treat them as absent unless you know otherwise.
  name: debug
- description: This document and the reference page rendered from it. Registered only
    when DOCS_ENABLED is true.
  name: documentation
