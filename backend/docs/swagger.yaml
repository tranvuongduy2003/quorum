  /api/v1/ping:
    get:
      description: Cheapest versioned route. It touches no dependency, so it confirms
        the router, the middleware chain and the rate-limit budget and nothing else.
      operationId: getPing
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
          description: OK
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
