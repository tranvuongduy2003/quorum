components:
  schemas:
    DatabaseTimeResponse:
      properties:
        database_time:
          example: "2026-08-27T18:20:31Z"
          format: date-time
          type: string
      required:
      - database_time
      type: object
    DependencyStatus:
      properties:
        name:
          enum:
          - postgres
          - redis
          example: postgres
          type: string
        status:
          enum:
          - up
          - down
          example: up
          type: string
      required:
      - name
      - status
      type: object
    EchoRequest:
      properties:
        message:
          example: hello
          maxLength: 280
          minLength: 1
          type: string
      required:
      - message
      type: object
    EchoResponse:
      properties:
        length:
          example: 5
          type: integer
        message:
          example: hello
          type: string
      required:
      - length
      - message
      type: object
    ErrorBody:
      properties:
        code:
          enum:
          - INVALID_JSON
          - VALIDATION_FAILED
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - PAYLOAD_TOO_LARGE
          - RATE_LIMITED
          - REQUEST_TIMEOUT
          - SERVICE_UNAVAILABLE
          - INTERNAL
          example: VALIDATION_FAILED
          type: string
        details:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
          uniqueItems: false
        message:
          example: the request contains one or more invalid values
          type: string
        request_id:
          example: 9f1c0c2e-1f2a-4a9b-8f0e-2d6a3f7b1c44
          type: string
      required:
      - code
      - message
      - request_id
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
      type: object
    FieldError:
      properties:
        code:
          enum:
          - REQUIRED
          - TOO_LONG
          - OUT_OF_RANGE
          example: TOO_LONG
          type: string
        field:
          example: message
          type: string
        message:
          example: at most 280 characters
          type: string
      required:
      - code
      - field
      - message
      type: object
    HealthResponse:
      properties:
        status:
          enum:
          - ok
          example: ok
          type: string
      required:
      - status
      type: object
    PingResponse:
      properties:
        message:
          example: pong
          type: string
      required:
      - message
      type: object
    ReadinessResponse:
      properties:
        checked_at:
          example: "2026-08-27T18:20:31Z"
          format: date-time
          type: string
        dependencies:
          items:
            $ref: '#/components/schemas/DependencyStatus'
          type: array
          uniqueItems: false
        status:
          enum:
          - ready
          - not_ready
          example: ready
          type: string
      required:
      - checked_at
      - dependencies
      - status
      type: object
externalDocs:
  description: OpenAPI 3.1.0, the specification this document follows
  url: https://spec.openapis.org/oas/v3.1.0.html
info:
  description: 'The service foundation for Quorum: health probes, diagnostics routes,
    one shared error envelope and one shared rate-limit budget. Every failure except
    the readiness report uses the same envelope, and every response carries an X-Request-Id
    you can quote in a bug report.'
  title: Quorum API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/db/time:
    get:
      description: Runs one query against PostgreSQL and returns its current time,
        which proves the connection pool works end to end. The 503 carries no detail
        about the cause; the request id is how to find it in the logs.
      operationId: getDatabaseTime
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseTimeResponse'
          description: OK
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: the client has spent its budget for the current window
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: integer
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: PostgreSQL is unreachable, or the rate limiter is unavailable
            and configured to fail closed
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Read the database clock
      tags:
      - diagnostics
