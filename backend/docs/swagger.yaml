      parameters:
      - description: milliseconds to sleep
        in: query
        name: ms
        schema:
          default: 2000
          maximum: 30000
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
          description: OK
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ms is not a whole number of milliseconds between 0 and 30000
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: the client has spent its budget for the current window
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema:
                type: integer
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: the rate limiter is unavailable and configured to fail closed
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: the sleep outlasted the per-request timeout
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: requests left in the current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: seconds until the window resets
              schema:
                type: integer
            X-Request-Id:
              description: correlation id, present on every response
              schema:
                type: string
      summary: Sleep for a bounded time
      tags:
      - debug
  /api/v1/echo:
    post:
      description: 'Validates the message as a domain value object and returns it
        with its length in runes. The 400 covers two codes: INVALID_JSON for a body
        that does not parse, and VALIDATION_FAILED for one that parses and breaks
        a rule, with the offending field named in details.'
      operationId: echoMessage
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/EchoRequest'
                description: the message to echo
                summary: body
        description: the message to echo
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'
          description: OK
          headers:
            X-RateLimit-Limit:
              description: requests allowed per window
              schema:
                type: integer
            X-RateLimit-Remaining:
